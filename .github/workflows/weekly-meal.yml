name: Send weekly meal suggestions

on:
  # Allows you to test it manually from the Actions tab
  workflow_dispatch:

  # Runs every Friday at 8:17 am Melbourne time
  schedule:
    - cron: "17 8 * * 3"
      timezone: "Australia/Melbourne"

jobs:
  send-meal-suggestions:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install required packages
        run: python -m pip install -r requirements.txt

      - name: Generate and email meal suggestions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MEALS_PER_WEEK: "7"
        run: python weekly_meal_plan_llm_v2.py
